# Baut bei jedem Push eine installierbare Debug-APK und hängt sie als
# Artifact an den Workflow-Lauf (Actions-Tab → Lauf öffnen → "heimai-debug-apk").
# Die Debug-APK ist mit dem Debug-Key signiert und lässt sich direkt
# per Sideload installieren ("Unbekannte Quellen" erlauben).
name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: heimai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
